name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 2 * * 5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tidy:
    uses: taiki-e/github-actions/.github/workflows/tidy.yml@07c8b42e7ad077d40127201ac62770c6eb31893e # 2026.11.1
    permissions:
      security-events: write # for github/codeql-action/*
  codegen:
    needs: tidy
    uses: taiki-e/github-actions/.github/workflows/gen.yml@07c8b42e7ad077d40127201ac62770c6eb31893e # 2026.11.1
    permissions:
      contents: write # for creating branch for pr
      pull-requests: read # for gh pr list
    secrets:
      PR_TOKEN_APP_PRIVATE_KEY: ${{ secrets.PR_TOKEN_APP_PRIVATE_KEY }}
  test:
    needs: tidy
    uses: taiki-e/github-actions/.github/workflows/rust-test.yml@07c8b42e7ad077d40127201ac62770c6eb31893e # 2026.11.1
    with:
      test-args: --exclude cargo-config2-internal-codegen
      no-std: false
